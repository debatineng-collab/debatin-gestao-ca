<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Debatin CA">
<meta name="theme-color" content="#1D478D">
<title>Debatin — Gestão CA</title>
<link rel="manifest" href="manifest.json">
<style>
* { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
body { font-family:"Segoe UI",system-ui,sans-serif; overscroll-behavior:none; }
::-webkit-scrollbar{width:6px}
::-webkit-scrollbar-track{background:#f0f2f5}
::-webkit-scrollbar-thumb{background:#c0c5d0;border-radius:3px}
select option{background:#fff}

/* TOAST */
#toast{position:fixed;bottom:24px;right:16px;z-index:9999;display:flex;flex-direction:column;gap:8px;pointer-events:none;max-width:calc(100vw - 32px);}
.toast-item{padding:11px 16px;border-radius:6px;font-size:12px;font-weight:700;letter-spacing:.5px;box-shadow:0 4px 16px rgba(0,0,0,.18);animation:slideIn .25s ease;display:flex;align-items:center;gap:8px;}
.toast-ok{background:#1a9e5c;color:#fff}
.toast-err{background:#d63031;color:#fff}
.toast-info{background:#1D478D;color:#fff}
@keyframes slideIn{from{transform:translateX(60px);opacity:0}to{transform:translateX(0);opacity:1}}

/* IO MODAL */
.io-overlay{position:fixed;inset:0;background:rgba(15,20,40,.6);z-index:500;display:flex;align-items:center;justify-content:center;backdrop-filter:blur(5px);padding:16px;}
.io-box{background:#fff;border-radius:10px;padding:24px;width:100%;max-width:500px;max-height:90vh;overflow-y:auto;box-shadow:0 20px 60px rgba(0,0,0,.2);}
.io-title{font-size:16px;font-weight:800;color:#1D478D;margin-bottom:16px;padding-bottom:12px;border-bottom:2px solid rgba(29,71,141,.12);display:flex;align-items:center;gap:8px;}
.io-label{font-size:10px;font-weight:700;letter-spacing:1.5px;text-transform:uppercase;color:#7a8099;margin-bottom:8px;}
.io-desc{font-size:12px;color:#404041;line-height:1.6;margin-bottom:10px;}
.io-btn{padding:10px 16px;border-radius:5px;font-weight:700;font-size:12px;letter-spacing:1px;text-transform:uppercase;cursor:pointer;border:none;font-family:inherit;display:inline-flex;align-items:center;gap:6px;transition:all .15s;}
.io-btn-primary{background:#1D478D;color:#fff;}
.io-btn-outline{background:transparent;border:1.5px solid #1D478D;color:#1D478D;}
.io-btn-ghost{background:transparent;border:1.5px solid #dde1e9;color:#7a8099;}
.io-divider{height:1px;background:#dde1e9;margin:16px 0;}
.io-footer{display:flex;justify-content:flex-end;gap:8px;margin-top:16px;padding-top:14px;border-top:1px solid #dde1e9;}
.io-stats{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:10px;}
.io-stat{background:#f0f4ff;border-radius:5px;padding:10px;text-align:center;}
.io-stat-val{font-size:20px;font-weight:800;color:#1D478D;}
.io-stat-lbl{font-size:9px;font-weight:600;letter-spacing:1px;text-transform:uppercase;color:#7a8099;margin-top:2px;}
.drop-zone{border:2px dashed #c8cdd8;border-radius:8px;padding:24px;text-align:center;cursor:pointer;transition:all .2s;background:#f7f8fa;position:relative;}
.drop-zone:hover,.drop-zone.over{border-color:#1D478D;background:rgba(29,71,141,.05);}
.drop-zone input{position:absolute;inset:0;opacity:0;cursor:pointer;width:100%;height:100%;}
.drop-zone-icon{font-size:28px;margin-bottom:6px;opacity:.4;}
.drop-zone-text{font-size:12px;color:#7a8099;font-weight:500;}
.drop-zone-text span{color:#1D478D;font-weight:700;}

/* INSTALL BANNER */
#installBanner{display:none;position:fixed;bottom:0;left:0;right:0;background:#1D478D;color:#fff;padding:12px 20px;z-index:400;align-items:center;justify-content:space-between;gap:12;box-shadow:0 -4px 16px rgba(29,71,141,.3);}
#installBanner.show{display:flex;}
.install-text{font-size:12px;font-weight:600;flex:1;}
.install-btn{background:#fff;color:#1D478D;border:none;border-radius:4px;padding:7px 14px;font-weight:700;font-size:11px;cursor:pointer;font-family:inherit;letter-spacing:.5px;}
.install-dismiss{background:none;border:none;color:rgba(255,255,255,.7);font-size:18px;cursor:pointer;padding:0 4px;}

.hdr-btn{background:rgba(255,255,255,.15);color:#fff;border:1px solid rgba(255,255,255,.3);border-radius:3px;font-size:10px;padding:5px 10px;cursor:pointer;font-family:inherit;font-weight:700;letter-spacing:1px;transition:all .15s;white-space:nowrap;}
.hdr-btn:hover{background:rgba(255,255,255,.28);}

/* RESPONSIVO MOBILE */
@media(max-width:640px){
  .hide-mobile{display:none!important;}
  .main-pad{padding:14px 12px!important;}
  .stats-grid{grid-template-columns:1fr 1fr!important;}
  .tabs-scroll{padding:0 12px!important;}
  .tab-btn{padding:12px 10px!important;font-size:10px!important;}
}
</style>

<body>
<div id="root"></div>
<div id="toast"></div>

<!-- INSTALL BANNER (Android Chrome) -->
<div id="installBanner">
  <span class="install-text">📲 Instalar Debatin CA na tela inicial</span>
  <button class="install-btn" id="installBtn">Instalar</button>
  <button class="install-dismiss" onclick="document.getElementById('installBanner').classList.remove('show')">✕</button>
</div>

<script>
// ── PWA: Service Worker + Install ─────────────────────────────
if('serviceWorker' in navigator) {
  window.addEventListener('load', () => {
    navigator.serviceWorker.register('sw.js').catch(()=>{});
  });
}

let deferredPrompt = null;
window.addEventListener('beforeinstallprompt', (e) => {
  e.preventDefault();
  deferredPrompt = e;
  document.getElementById('installBanner').classList.add('show');
});

document.getElementById('installBtn').addEventListener('click', async () => {
  if (!deferredPrompt) return;
  deferredPrompt.prompt();
  const { outcome } = await deferredPrompt.userChoice;
  deferredPrompt = null;
  document.getElementById('installBanner').classList.remove('show');
});

window.addEventListener('appinstalled', () => {
  document.getElementById('installBanner').classList.remove('show');
  toast('App instalado com sucesso! 🎉', 'ok');
});

// ── STORAGE ───────────────────────────────────────────────────
async function salvar(key, data) {
  try { localStorage.setItem('debatin:'+key, JSON.stringify(data)); } catch(e){}
}
async function carregar(key, fallback=[]) {
  try { const v=localStorage.getItem('debatin:'+key); return v?JSON.parse(v):fallback; } catch(e){return fallback;}
}

// ── TOAST ──────────────────────────────────────────────────────
function toast(msg, type='ok', dur=3000) {
  const c=document.getElementById('toast');
  const el=document.createElement('div');
  el.className='toast-item toast-'+type;
  el.innerHTML=`<span>${{ok:'✓',err:'✗',info:'ℹ'}[type]||'•'}</span><span>${msg}</span>`;
  c.appendChild(el);
  setTimeout(()=>{el.style.animation='slideIn .25s ease reverse';setTimeout(()=>el.remove(),250);},dur);
}
window.showToast = toast;
</script>

// ── STORAGE HELPERS ───────────────────────────────────────────
async function salvar(key, data) {
  try { await window.storage.set(key, JSON.stringify(data)); } catch(e) { console.error("storage.set:", e); }
}
async function carregar(key, fallback = []) {
  try { const r = await window.storage.get(key); return r ? JSON.parse(r.value) : fallback; } catch { return fallback; }
}

// ── CORES DEBATIN ─────────────────────────────────────────────
const B = "#1D478D", BD = "#163669", BL = "rgba(29,71,141,0.1)", BBR = "rgba(29,71,141,0.3)";
const GR = "#404041";
const VD = "#1a9e5c", VM = "#d4860a", VR = "#d63031";

// ── COMPONENTES BASE ──────────────────────────────────────────
const Card = ({children, style={}}) => (
  <div style={{background:"#fff",border:"1px solid #dde1e9",borderRadius:8,padding:20,marginBottom:16,boxShadow:"0 1px 4px rgba(0,0,0,.05)",...style}}>
    {children}
  </div>
);

const CardTitle = ({children}) => (
  <div style={{fontSize:10,fontWeight:700,letterSpacing:2,textTransform:"uppercase",color:B,marginBottom:14,paddingBottom:10,borderBottom:`2px solid ${BL}`,display:"flex",alignItems:"center",gap:6}}>
    <span style={{width:3,height:13,background:B,borderRadius:2,display:"inline-block"}}/>
    {children}
  </div>
);

const Stat = ({label,value,cor,sub}) => (
  <div style={{background:"#fff",border:"1px solid #dde1e9",borderRadius:8,padding:"14px 18px",borderLeft:`4px solid ${cor}`,boxShadow:"0 1px 3px rgba(0,0,0,.04)"}}>
    <div style={{fontSize:9,fontWeight:700,letterSpacing:1.5,textTransform:"uppercase",color:"#7a8099",marginBottom:6}}>{label}</div>
    <div style={{fontSize:30,fontWeight:800,color:cor,lineHeight:1}}>{value}</div>
    {sub && <div style={{fontSize:10,color:"#7a8099",marginTop:4}}>{sub}</div>}
  </div>
);

const Btn = ({children,onClick,variant="primary",size="md",disabled=false,style={}}) => {
  const base = {fontFamily:"inherit",fontWeight:700,letterSpacing:1,textTransform:"uppercase",border:"none",borderRadius:5,cursor:disabled?"not-allowed":"pointer",display:"inline-flex",alignItems:"center",gap:6,opacity:disabled?.6:1,transition:"all .15s",...style};
  const vars = {
    primary:{background:B,color:"#fff",padding:size==="sm"?"5px 12px":"9px 18px",fontSize:size==="sm"?10:12},
    outline:{background:"transparent",border:`1.5px solid ${B}`,color:B,padding:size==="sm"?"4px 11px":"8px 17px",fontSize:size==="sm"?10:12},
    ghost:{background:"transparent",border:"1.5px solid #c8cdd8",color:"#7a8099",padding:size==="sm"?"4px 11px":"8px 17px",fontSize:size==="sm"?10:12},
    danger:{background:VR,color:"#fff",padding:size==="sm"?"5px 12px":"9px 18px",fontSize:size==="sm"?10:12},
    success:{background:VD,color:"#fff",padding:size==="sm"?"5px 12px":"9px 18px",fontSize:size==="sm"?10:12},
  };
  return <button style={{...base,...vars[variant]}} onClick={onClick} disabled={disabled}>{children}</button>;
};

const Badge = ({children,color="blue"}) => {
  const colors = {blue:{bg:BL,text:B,border:BBR},green:{bg:"#eaf7f1",text:VD,border:"rgba(26,158,92,.3)"},red:{bg:"#fdeaea",text:VR,border:"rgba(214,48,49,.3)"},yellow:{bg:"#fef6e4",text:VM,border:"rgba(212,134,10,.3)"},gray:{bg:"#f0f0f1",text:"#7a8099",border:"#dde1e9"}};
  const c = colors[color]||colors.blue;
  return <span style={{fontSize:9,fontWeight:700,padding:"2px 8px",borderRadius:3,letterSpacing:1,textTransform:"uppercase",background:c.bg,color:c.text,border:`1px solid ${c.border}`,display:"inline-flex",alignItems:"center",gap:4}}>{children}</span>;
};

const Field = ({label,children}) => (
  <div style={{display:"flex",flexDirection:"column",gap:4}}>
    <label style={{fontSize:10,fontWeight:700,letterSpacing:1.5,textTransform:"uppercase",color:"#7a8099"}}>{label}</label>
    {children}
  </div>
);

const Input = ({value,onChange,placeholder,type="text",style={}}) => (
  <input type={type} value={value} onChange={e=>onChange(e.target.value)} placeholder={placeholder}
    style={{background:"#f7f8fa",border:"1.5px solid #dde1e9",borderRadius:5,padding:"8px 11px",fontSize:13,fontFamily:"inherit",outline:"none",width:"100%",...style}}
    onFocus={e=>e.target.style.borderColor=B} onBlur={e=>e.target.style.borderColor="#dde1e9"} />
);

const Select = ({value,onChange,children,style={}}) => (
  <select value={value} onChange={e=>onChange(e.target.value)}
    style={{background:"#f7f8fa",border:"1.5px solid #dde1e9",borderRadius:5,padding:"8px 11px",fontSize:13,fontFamily:"inherit",outline:"none",width:"100%",...style}}
    onFocus={e=>e.target.style.borderColor=B} onBlur={e=>e.target.style.borderColor="#dde1e9"}>
    {children}
  </select>
);

const Modal = ({open,onClose,title,children,footer}) => {
  if(!open) return null;
  return (
    <div style={{position:"fixed",inset:0,background:"rgba(15,20,40,.55)",zIndex:200,display:"flex",alignItems:"center",justifyContent:"center",backdropFilter:"blur(4px)"}} onClick={e=>{if(e.target===e.currentTarget)onClose();}}>
      <div style={{background:"#fff",border:"1px solid #dde1e9",borderRadius:10,padding:24,width:"92%",maxWidth:580,maxHeight:"90vh",overflowY:"auto",boxShadow:"0 20px 60px rgba(0,0,0,.18)"}}>
        <div style={{display:"flex",alignItems:"center",justifyContent:"space-between",marginBottom:16,paddingBottom:12,borderBottom:"2px solid #dde1e9"}}>
          <div style={{fontSize:15,fontWeight:800,color:GR}}>{title}</div>
          <button onClick={onClose} style={{background:"none",border:"1.5px solid #dde1e9",borderRadius:4,width:28,height:28,cursor:"pointer",fontSize:13,color:"#7a8099",display:"flex",alignItems:"center",justifyContent:"center"}}>✕</button>
        </div>
        <div>{children}</div>
        {footer && <div style={{display:"flex",gap:8,justifyContent:"flex-end",marginTop:16,paddingTop:14,borderTop:"1px solid #dde1e9"}}>{footer}</div>}
      </div>
    </div>
  );
};

// ── MINI BAR CHART ─────────────────────────────────────────────
const BarChart = ({data, height=120}) => {
  if(!data||!data.length) return <div style={{height,display:"flex",alignItems:"center",justifyContent:"center",color:"#ccc",fontSize:12}}>Sem dados</div>;
  const max = Math.max(...data.map(d=>d.value), 1);
  return (
    <div style={{display:"flex",alignItems:"flex-end",gap:6,height,paddingBottom:20,position:"relative"}}>
      {data.map((d,i)=>(
        <div key={i} style={{flex:1,display:"flex",flexDirection:"column",alignItems:"center",gap:2}}>
          <div style={{fontSize:9,fontWeight:700,color:d.color||B}}>{d.value}</div>
          <div style={{width:"100%",background:d.color||B,borderRadius:"3px 3px 0 0",height:Math.max(4,(d.value/max)*( height-30)),opacity:.85,transition:"height .4s"}}/>
          <div style={{fontSize:8,color:"#7a8099",textAlign:"center",whiteSpace:"nowrap",overflow:"hidden",textOverflow:"ellipsis",maxWidth:"100%"}}>{d.label}</div>
        </div>
      ))}
    </div>
  );
};

// ── GAUGE ──────────────────────────────────────────────────────
const Gauge = ({pct, size=100}) => {
  const r = (size/2)-10;
  const circ = 2*Math.PI*r;
  const dash = (pct/100)*circ*0.75;
  const cor = pct>=80?VD:pct>=60?VM:VR;
  return (
    <svg width={size} height={size*0.75} viewBox={`0 0 ${size} ${size*0.75}`}>
      <path d={`M ${size*0.1} ${size*0.7} A ${r} ${r} 0 1 1 ${size*0.9} ${size*0.7}`} fill="none" stroke="#f0f2f5" strokeWidth={8} strokeLinecap="round"/>
      <path d={`M ${size*0.1} ${size*0.7} A ${r} ${r} 0 1 1 ${size*0.9} ${size*0.7}`} fill="none" stroke={cor} strokeWidth={8} strokeLinecap="round" strokeDasharray={`${dash} ${circ}`} style={{transition:"stroke-dasharray .6s"}}/>
      <text x={size/2} y={size*0.62} textAnchor="middle" fontSize={size*0.18} fontWeight={800} fill={cor}>{pct}%</text>
      <text x={size/2} y={size*0.76} textAnchor="middle" fontSize={size*0.1} fill="#7a8099">Aprovação</text>
    </svg>
  );
};

// ── APP PRINCIPAL ──────────────────────────────────────────────
function App() {
  const [tab, setTab] = useState("dashboard");
  const [clientes, setClientes] = useState([]);
  const [obras, setObras] = useState([]);
  const [inspections, setInspections] = useState([]);
  const [rncs, setRncs] = useState([]);
  const [loading, setLoading] = useState(true);
  const [saved, setSaved] = useState(false);

  // ── LOAD ──
  useEffect(()=>{
    (async()=>{
      const [c,o,ins,r] = await Promise.all([
        carregar("dbt:clientes",[]),
        carregar("dbt:obras",[]),
        carregar("dbt:inspections",[]),
        carregar("dbt:rncs",[]),
      ]);
      setClientes(c); setObras(o); setInspections(ins); setRncs(r);
      setLoading(false);
    })();
  },[]);

  // ── SAVE ──
  const persist = useCallback(async(ins, rn)=>{
    await Promise.all([
      salvar("dbt:inspections", ins||inspections),
      salvar("dbt:rncs", rn||rncs),
    ]);
    setSaved(true);
    setTimeout(()=>setSaved(false),2000);
  },[inspections, rncs]);

  const persistAll = useCallback(async(c,o,ins,rn)=>{
    await Promise.all([
      salvar("dbt:clientes", c),
      salvar("dbt:obras", o),
      salvar("dbt:inspections", ins),
      salvar("dbt:rncs", rn),
    ]);
    setSaved(true);
    setTimeout(()=>setSaved(false),2000);
  },[]);

  // ── ADD INSPEÇÃO ──
  const addInspecao = useCallback(async(ins)=>{
    const next = [...inspections, ins];
    setInspections(next);
    await salvar("dbt:inspections", next);
    setSaved(true); setTimeout(()=>setSaved(false),2000);
  },[inspections]);

  const addRNC = useCallback(async(rnc, insUpdated)=>{
    const nextR = [...rncs, rnc];
    const nextI = insUpdated ? inspections.map(i=>i.id===insUpdated.id?insUpdated:i) : inspections;
    setRncs(nextR); setInspections(nextI);
    await persist(nextI, nextR);
  },[rncs, inspections, persist]);

  const encerrarRNC = useCallback(async(id)=>{
    const next = rncs.map(r=>r.id===id?{...r,status:"encerrada"}:r);
    setRncs(next);
    await salvar("dbt:rncs", next);
    setSaved(true); setTimeout(()=>setSaved(false),2000);
  },[rncs]);

  if(loading) return (
    <div style={{minHeight:"100vh",background:"#f0f2f5",display:"flex",alignItems:"center",justifyContent:"center",flexDirection:"column",gap:12}}>
      <img src={`data:image/png;base64,${LOGO}`} style={{width:60,height:60,objectFit:"contain",background:"#fff",borderRadius:10,padding:6}} alt=""/>
      <div style={{fontSize:13,fontWeight:700,color:B,letterSpacing:2}}>CARREGANDO DADOS...</div>
    </div>
  );

  const tabs = [
    {id:"dashboard",label:"📊 Dashboard"},
    {id:"cadastros",label:"⚙ Cadastros"},
    {id:"inspecao",label:"＋ Inspeção"},
    {id:"registros",label:`📋 Registros (${inspections.length})`},
    {id:"rnc",label:`⚠ RNCs (${rncs.filter(r=>r.status==="aberta").length})`},
  ];

  return (
    <div style={{minHeight:"100vh",background:"#f0f2f5",fontFamily:"'Segoe UI',system-ui,sans-serif"}}>
      {/* HEADER */}
      <div style={{background:B,padding:"0 24px",display:"flex",alignItems:"center",justifyContent:"space-between",height:60,position:"sticky",top:0,zIndex:100,boxShadow:`0 2px 12px rgba(29,71,141,.35)`}}>
        <div style={{display:"flex",alignItems:"center",gap:12}}>
          <img src={`data:image/png;base64,${LOGO}`} style={{width:40,height:40,objectFit:"contain",background:"#fff",borderRadius:6,padding:3}} alt="Debatin"/>
          <div>
            <div style={{color:"#fff",fontSize:14,fontWeight:800,letterSpacing:1,textTransform:"uppercase"}}>Debatin Engenharia</div>
            <div style={{color:"rgba(255,255,255,.7)",fontSize:9,letterSpacing:1.5,textTransform:"uppercase"}}>Checklist · Estrutura CA</div>
          </div>
        </div>
        <div style={{display:"flex",alignItems:"center",gap:10}}>
          {saved && <span style={{background:"rgba(26,158,92,.2)",color:"#6effa8",border:"1px solid rgba(26,158,92,.4)",borderRadius:3,fontSize:10,padding:"3px 10px",fontWeight:700,letterSpacing:1}}>✓ SALVO</span>}
          <span style={{background:"rgba(255,255,255,.15)",color:"#fff",border:"1px solid rgba(255,255,255,.3)",borderRadius:3,fontSize:10,padding:"3px 10px",letterSpacing:1}}>
            {new Date().toLocaleDateString("pt-BR",{day:"2-digit",month:"short",year:"numeric"}).toUpperCase()}
          </span>
        </div>
      </div>

      {/* TABS */}
      <div style={{background:"#fff",borderBottom:"1px solid #dde1e9",padding:"0 24px",display:"flex",gap:0,overflowX:"auto"}}>
        {tabs.map(t=>(
          <button key={t.id} onClick={()=>setTab(t.id)}
            style={{padding:"14px 16px",background:"none",border:"none",borderBottom:`3px solid ${tab===t.id?B:"transparent"}`,color:tab===t.id?B:"#7a8099",fontWeight:700,fontSize:11,letterSpacing:1,textTransform:"uppercase",cursor:"pointer",whiteSpace:"nowrap",fontFamily:"inherit",transition:"all .15s"}}>
            {t.label}
          </button>
        ))}
      </div>

      {/* CONTENT */}
      <div style={{maxWidth:1140,margin:"0 auto",padding:"24px 20px"}}>
        {tab==="dashboard" && <Dashboard inspections={inspections} rncs={rncs} obras={obras} clientes={clientes}/>}
        {tab==="cadastros" && <Cadastros clientes={clientes} setClientes={setClientes} obras={obras} setObras={setObras} persistAll={persistAll} inspections={inspections} rncs={rncs}/>}
        {tab==="inspecao" && <NovaInspecao clientes={clientes} obras={obras} addInspecao={addInspecao} addRNC={addRNC} inspections={inspections} setTab={setTab}/>}
        {tab==="registros" && <Registros inspections={inspections} clientes={clientes} obras={obras}/>}
        {tab==="rnc" && <RNCs rncs={rncs} encerrarRNC={encerrarRNC}/>}
      </div>
    </div>
  );
}

// ── DASHBOARD ─────────────────────────────────────────────────
function Dashboard({inspections, rncs, obras, clientes}) {
  const total = inspections.length;
  const aprov = inspections.filter(i=>i.status==="aprovado").length;
  const reinsp = inspections.filter(i=>i.status==="reinspeção").length;
  const rncA = rncs.filter(r=>r.status==="aberta").length;
  const pctAprov = total>0?Math.round(aprov/total*100):0;

  // Ranking de itens mais reprovados
  const reprovados = {};
  inspections.forEach(ins=>{
    if(!ins.snapshot) return;
    Object.entries(ins.snapshot).forEach(([key,val])=>{
      if(val==="nok"){
        const [g,i] = key.split("_");
        const label = CHECKLIST[g]?.[parseInt(i)];
        if(label) reprovados[label] = (reprovados[label]||0)+1;
      }
    });
  });
  const rankReprov = Object.entries(reprovados).sort((a,b)=>b[1]-a[1]).slice(0,6);

  // Taxa por obra
  const porObra = {};
  inspections.forEach(ins=>{
    if(!ins.nomeObra) return;
    if(!porObra[ins.nomeObra]) porObra[ins.nomeObra] = {total:0,aprov:0};
    porObra[ins.nomeObra].total++;
    if(ins.status==="aprovado") porObra[ins.nomeObra].aprov++;
  });
  const obraData = Object.entries(porObra).map(([nome,v])=>({label:nome.split(" ").slice(0,2).join(" "),value:Math.round(v.aprov/v.total*100),color:B})).slice(0,6);

  // Tendência mensal
  const meses = {};
  inspections.forEach(ins=>{
    if(!ins.data) return;
    const m = ins.data.substring(0,7);
    if(!meses[m]) meses[m]={total:0,aprov:0};
    meses[m].total++;
    if(ins.status==="aprovado") meses[m].aprov++;
  });
  const tendencia = Object.entries(meses).sort().slice(-6).map(([m,v])=>({
    label:new Date(m+"-15").toLocaleDateString("pt-BR",{month:"short"}).toUpperCase(),
    value:Math.round(v.aprov/v.total*100),
    color:v.aprov/v.total>=.8?VD:v.aprov/v.total>=.6?VM:VR,
  }));

  // Por etapa
  const etapaCount = {forma:0,armadura:0,concreto:0,pos:0};
  const etapaAprov = {forma:0,armadura:0,concreto:0,pos:0};
  inspections.forEach(ins=>{
    if(ins.etapa && etapaCount[ins.etapa]!==undefined){
      etapaCount[ins.etapa]++;
      if(ins.status==="aprovado") etapaAprov[ins.etapa]++;
    }
  });

  return (
    <div>
      <div style={{marginBottom:20}}>
        <div style={{fontSize:20,fontWeight:800,color:GR}}>Dashboard <span style={{color:B}}>Lean</span></div>
        <div style={{fontSize:10,fontWeight:600,letterSpacing:1.5,textTransform:"uppercase",color:"#7a8099",marginTop:3}}>Análise de desempenho e melhoria contínua</div>
      </div>

      {/* KPIs */}
      <div style={{display:"grid",gridTemplateColumns:"repeat(4,1fr)",gap:14,marginBottom:20}}>
        <Stat label="Total Inspecionado" value={total} cor={B} sub={`${obras.length} obras · ${clientes.length} clientes`}/>
        <Stat label="Aprovadas" value={aprov} cor={VD} sub={`${pctAprov}% de aprovação`}/>
        <Stat label="Em Reinspeção" value={reinsp} cor={VM} sub={`${total>0?Math.round(reinsp/total*100):0}% do total`}/>
        <Stat label="RNCs Abertas" value={rncA} cor={VR} sub={`${rncs.length} total geradas`}/>
      </div>

      {total===0 ? (
        <Card>
          <div style={{textAlign:"center",padding:"40px 0",color:"#7a8099"}}>
            <div style={{fontSize:36,marginBottom:10,opacity:.3}}>📊</div>
            <div style={{fontSize:13,fontWeight:600}}>Nenhuma inspeção registrada ainda.</div>
            <div style={{fontSize:11,marginTop:6}}>Cadastre obras e inicie inspeções para ver o dashboard completo.</div>
          </div>
        </Card>
      ) : (
        <>
        {/* Gauge + Tendência */}
        <div style={{display:"grid",gridTemplateColumns:"200px 1fr",gap:14,marginBottom:14}}>
          <Card style={{display:"flex",flexDirection:"column",alignItems:"center",justifyContent:"center"}}>
            <CardTitle>Taxa Global</CardTitle>
            <Gauge pct={pctAprov} size={150}/>
            <div style={{fontSize:10,color:"#7a8099",marginTop:6,textAlign:"center"}}>Meta Lean: ≥ 85%</div>
            <div style={{width:"100%",height:4,background:"#f0f2f5",borderRadius:2,marginTop:8,overflow:"hidden"}}>
              <div style={{width:`${pctAprov}%`,height:"100%",background:pctAprov>=80?VD:pctAprov>=60?VM:VR,borderRadius:2,transition:"width .5s"}}/>
            </div>
          </Card>
          <Card>
            <CardTitle>Tendência Mensal de Aprovação (%)</CardTitle>
            {tendencia.length>0 ? <BarChart data={tendencia} height={130}/> : <div style={{height:130,display:"flex",alignItems:"center",justifyContent:"center",color:"#ccc",fontSize:12}}>Dados insuficientes</div>}
          </Card>
        </div>

        {/* Taxa por obra + Ranking NOK */}
        <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:14,marginBottom:14}}>
          <Card>
            <CardTitle>Taxa de Aprovação por Obra (%)</CardTitle>
            {obraData.length>0 ? <BarChart data={obraData} height={130}/> : <div style={{height:130,display:"flex",alignItems:"center",justifyContent:"center",color:"#ccc",fontSize:12}}>Sem dados</div>}
          </Card>
          <Card>
            <CardTitle>🔴 Top Itens com Maior NOK (Causas Raiz)</CardTitle>
            {rankReprov.length===0 ? (
              <div style={{textAlign:"center",padding:"30px 0",color:"#ccc",fontSize:12}}>Nenhum item reprovado ainda ✅</div>
            ) : rankReprov.map(([item,cnt],i)=>(
              <div key={i} style={{display:"flex",alignItems:"center",gap:10,padding:"7px 0",borderBottom:"1px solid #f0f2f5"}}>
                <div style={{minWidth:22,height:22,borderRadius:"50%",background:i<2?VR:i<4?VM:"#dde1e9",color:i<4?"#fff":"#7a8099",display:"flex",alignItems:"center",justifyContent:"center",fontSize:10,fontWeight:800}}>{i+1}</div>
                <div style={{flex:1,fontSize:11,color:GR,lineHeight:1.3}}>{item}</div>
                <div style={{fontSize:13,fontWeight:800,color:i<2?VR:i<4?VM:"#7a8099",minWidth:28,textAlign:"right"}}>{cnt}x</div>
                <div style={{width:50,height:4,background:"#f0f2f5",borderRadius:2,overflow:"hidden"}}>
                  <div style={{width:`${(cnt/rankReprov[0][1])*100}%`,height:"100%",background:i<2?VR:i<4?VM:"#aaa",borderRadius:2}}/>
                </div>
              </div>
            ))}
          </Card>
        </div>

        {/* Por etapa */}
        <Card>
          <CardTitle>Desempenho por Etapa</CardTitle>
          <div style={{display:"grid",gridTemplateColumns:"repeat(4,1fr)",gap:12}}>
            {Object.entries(GL).map(([key,label])=>{
              const t=etapaCount[key], a=etapaAprov[key], pct=t>0?Math.round(a/t*100):null;
              return (
                <div key={key} style={{background:"#f7f8fa",border:`1.5px solid ${ETAPA_COR[key]}30`,borderRadius:8,padding:14,borderTop:`3px solid ${ETAPA_COR[key]}`}}>
                  <div style={{fontSize:10,fontWeight:700,letterSpacing:1,textTransform:"uppercase",color:ETAPA_COR[key],marginBottom:8}}>{label}</div>
                  {pct===null ? <div style={{fontSize:11,color:"#ccc"}}>Sem dados</div> : <>
                    <div style={{fontSize:24,fontWeight:800,color:pct>=80?VD:pct>=60?VM:VR}}>{pct}%</div>
                    <div style={{fontSize:10,color:"#7a8099",marginTop:3}}>{a}/{t} aprovadas</div>
                    <div style={{width:"100%",height:3,background:"#e0e3ea",borderRadius:2,marginTop:8,overflow:"hidden"}}>
                      <div style={{width:`${pct}%`,height:"100%",background:pct>=80?VD:pct>=60?VM:VR,borderRadius:2}}/>
                    </div>
                  </>}
                </div>
              );
            })}
          </div>
        </Card>
        </>
      )}
    </div>
  );
}

// ── CADASTROS ─────────────────────────────────────────────────
function Cadastros({clientes,setClientes,obras,setObras,persistAll,inspections,rncs}) {
  const [nc,setNc]=useState({nome:"",resp:"",tel:"",email:""});
  const [no,setNo]=useState({clienteId:"",nome:"",end:"",area:"",tipo:"Residencial",inicio:"",fim:"",qtdP:0,qtdV:0,qtdL:0,qtdF:0,qtdE:0});

  const salvarCliente = async () => {
    if(!nc.nome.trim()){alert("Informe o nome.");return;}
    const c=[...clientes,{id:"CLI-"+String(clientes.length+1).padStart(3,"0"),...nc}];
    setClientes(c); setNc({nome:"",resp:"",tel:"",email:""});
    await persistAll(c,obras,inspections,rncs);
  };

  const gerarPecas = (p,v,l,f,e) => {
    const res=[];
    [{p:"P",q:p},{p:"V",q:v},{p:"L",q:l},{p:"F",q:f},{p:"E",q:e}].forEach(({p:pf,q})=>{for(let i=1;i<=q;i++) res.push(pf+String(i).padStart(2,"0"));});
    return res;
  };

  const salvarObra = async () => {
    if(!no.clienteId||!no.nome.trim()){alert("Selecione o cliente e informe o nome.");return;}
    const pecas=gerarPecas(+no.qtdP||0,+no.qtdV||0,+no.qtdL||0,+no.qtdF||0,+no.qtdE||0);
    const o=[...obras,{id:"OBR-"+String(obras.length+1).padStart(3,"0"),...no,pecas}];
    setObras(o); setNo({clienteId:"",nome:"",end:"",area:"",tipo:"Residencial",inicio:"",fim:"",qtdP:0,qtdV:0,qtdL:0,qtdF:0,qtdE:0});

  };

  const pecasPreview = gerarPecas(+no.qtdP||0,+no.qtdV||0,+no.qtdL||0,+no.qtdF||0,+no.qtdE||0);

  const grid4={display:"grid",gridTemplateColumns:"repeat(4,1fr)",gap:12};

  return (
    <div>
      <div style={{fontSize:20,fontWeight:800,color:GR,marginBottom:4}}>Cadastro de <span style={{color:B}}>Clientes e Obras</span></div>
      <div style={{fontSize:10,fontWeight:600,letterSpacing:1.5,textTransform:"uppercase",color:"#7a8099",marginBottom:18}}>Gerenciamento de construtoras e projetos</div>

      <Card>
        <CardTitle>Cadastrar Construtora / Cliente</CardTitle>

          <Field label="Nome da Empresa"><Input value={nc.nome} onChange={v=>setNc({...nc,nome:v})} placeholder="Ex: Construtora ABC Ltda"/></Field>
          <Field label="Responsável"><Input value={nc.resp} onChange={v=>setNc({...nc,resp:v})} placeholder="Nome do responsável"/></Field>
        </div>
        <div style={{...grid2,marginBottom:14}}>
          <Field label="Telefone"><Input value={nc.tel} onChange={v=>setNc({...nc,tel:v})} placeholder="(XX) XXXXX-XXXX"/></Field>
          <Field label="E-mail"><Input value={nc.email} onChange={v=>setNc({...nc,email:v})} placeholder="contato@empresa.com"/></Field>
        </div>
        <div style={{display:"flex",justifyContent:"flex-end"}}><Btn onClick={salvarCliente} size="sm">+ Cadastrar Cliente</Btn></div>
      </Card>

      {clientes.length>0 && (
        <Card>
          <CardTitle>Clientes Cadastrados ({clientes.length})</CardTitle>
          {clientes.map(c=>(
            <div key={c.id} style={{display:"flex",alignItems:"center",justifyContent:"space-between",padding:"9px 12px",background:"#f7f8fa",border:"1px solid #dde1e9",borderRadius:5,marginBottom:5}}>
              <div>
                <div style={{fontWeight:700,fontSize:13}}>{c.nome}</div>
                <div style={{fontSize:11,color:"#7a8099",marginTop:2}}>{[c.resp,c.tel,c.email].filter(Boolean).join(" · ")}</div>
              </div>
              <Badge color="blue">{c.id}</Badge>
            </div>
          ))}

      <Card>
        <CardTitle>Cadastrar Obra</CardTitle>

          </Field>
          <Field label="Nome da Obra"><Input value={no.nome} onChange={v=>setNo({...no,nome:v})} placeholder="Ex: Residencial Palmeiras"/></Field>
          <Field label="Endereço"><Input value={no.end} onChange={v=>setNo({...no,end:v})} placeholder="Rua, nº, cidade"/></Field>
        </div>
        <div style={{...grid4,marginBottom:14}}>
          <Field label="Área (m²)"><Input type="number" value={no.area} onChange={v=>setNo({...no,area:v})} placeholder="775"/></Field>
          <Field label="Tipo">
            <Select value={no.tipo} onChange={v=>setNo({...no,tipo:v})}>
              {["Residencial","Comercial","Industrial","Misto","Infraestrutura"].map(t=><option key={t}>{t}</option>)}
            </Select>
          </Field>
          <Field label="Início"><Input type="date" value={no.inicio} onChange={v=>setNo({...no,inicio:v})}/></Field>
          <Field label="Previsão Entrega"><Input type="date" value={no.fim} onChange={v=>setNo({...no,fim:v})}/></Field>
        </div>
        <div style={{fontSize:10,fontWeight:700,letterSpacing:1.5,textTransform:"uppercase",color:"#7a8099",marginBottom:10,display:"flex",alignItems:"center",gap:8}}>
          <span>Pré-cadastro de Peças Estruturais</span>
          <div style={{flex:1,height:1,background:"#dde1e9"}}/>
        </div>
        <div style={{display:"grid",gridTemplateColumns:"repeat(5,1fr)",gap:10,marginBottom:12}}>
          {[["Pilares (P)","qtdP"],["Vigas (V)","qtdV"],["Lajes (L)","qtdL"],["Fundações (F)","qtdF"],["Escadas (E)","qtdE"]].map(([label,key])=>(
            <Field key={key} label={label}><Input type="number" value={no[key]} onChange={v=>setNo({...no,[key]:v})} placeholder="0"/></Field>
          ))}
        </div>
        {pecasPreview.length>0 && (
          <div style={{marginBottom:14}}>
            <div style={{fontSize:10,color:"#7a8099",fontWeight:600,marginBottom:6}}>Preview: {pecasPreview.length} peças</div>
            <div style={{display:"flex",flexWrap:"wrap",gap:5}}>
              {pecasPreview.slice(0,20).map(p=><span key={p} style={{padding:"2px 10px",borderRadius:20,border:`1.5px solid ${BBR}`,background:BL,color:B,fontSize:11,fontWeight:700}}>{p}</span>)}
              {pecasPreview.length>20 && <span style={{fontSize:11,color:"#7a8099",padding:"2px 8px"}}>+{pecasPreview.length-20} mais</span>}
            </div>
          </div>
        )}
        <div style={{display:"flex",justifyContent:"flex-end"}}><Btn onClick={salvarObra} size="sm">+ Cadastrar Obra</Btn></div>
      </Card>

      {obras.length>0 && (
        <Card>
          <CardTitle>Obras Cadastradas ({obras.length})</CardTitle>
          {obras.map(o=>{
            const cli=clientes.find(c=>c.id===o.clienteId);
            return (
              <div key={o.id} style={{padding:"10px 12px",background:"#f7f8fa",border:"1px solid #dde1e9",borderRadius:5,marginBottom:6}}>
                <div style={{display:"flex",justifyContent:"space-between",alignItems:"flex-start"}}>
                  <div>
                    <div style={{fontWeight:700,fontSize:13}}>{o.nome}{o.area?` (${o.area}m²)`:""}</div>
                    <div style={{fontSize:11,color:"#7a8099",marginTop:2}}>{cli?cli.nome+" · ":""}{o.tipo}{o.end?" · "+o.end:""}</div>
                  </div>
                  <Badge color="blue">{o.id}</Badge>
                </div>
                {o.pecas?.length>0 && (
                  <div style={{display:"flex",flexWrap:"wrap",gap:4,marginTop:8}}>
                    {o.pecas.slice(0,14).map(p=><Badge key={p} color="blue">{p}</Badge>)}
                    {o.pecas.length>14 && <Badge color="gray">+{o.pecas.length-14}</Badge>}
                  </div>
                )}
              </div>
            );
          })}
        </Card>
      )}
    </div>
  );
}

// ── NOVA INSPEÇÃO ─────────────────────────────────────────────
function NovaInspecao({clientes, obras, addInspecao, addRNC, inspections, setTab}) {
  const [clienteId,setClienteId]=useState("");
  const [obraId,setObraId]=useState("");
  const [data,setData]=useState(new Date().toISOString().split("T")[0]);
  const [resp,setResp]=useState("");
  const [tipoInsp,setTipoInsp]=useState("1a");
  const [tipoPeca,setTipoPeca]=useState("");
  const [pav,setPav]=useState("");
  const [tag,setTag]=useState("");
  const [etapa,setEtapa]=useState("forma");
  const [states,setStates]=useState({});
  const [obs,setObs]=useState("");
  const [rncModal,setRncModal]=useState(null);
  const [rncForm,setRncForm]=useState({desc:"",causa:"",resp:"",acao:""});
  const [saved2,setSaved2]=useState(false);

  const obrasFiltradas = obras.filter(o=>!clienteId||o.clienteId===clienteId);
  const obra = obras.find(o=>o.id===obraId);
  const prefix = PECA_PREFIX[tipoPeca]||"";
  const tagsRapidas = obra?.pecas?.filter(p=>p.startsWith(prefix))||[];
  const nok = Object.values(states).filter(v=>v==="nok").length;
  const ok  = Object.values(states).filter(v=>v==="ok").length;
  const isReinsp = tipoInsp==="reinsp";

  const setItem = (id,val) => setStates(s=>({...s,[id]:val}));

  const limpar = () => {
    setObraId(""); setClienteId(""); setResp(""); setTipoInsp("1a"); setTipoPeca(""); setPav(""); setTag(""); setEtapa("forma"); setStates({}); setObs("");
  };

  const salvar = async () => {
    const cliente = clientes.find(c=>c.id===clienteId);
    if(!obraId||!tipoPeca||!tag.trim()||!data||!resp.trim()){alert("Preencha: Obra, Tipo de Peça, TAG, Data e Responsável.");return;}
    const na=Object.values(states).filter(v=>v==="na").length;
    let status;
    if(nok===0&&ok>0) status="aprovado";
    else if(nok>0&&!isReinsp) status="reinspeção";
    else if(nok>0&&isReinsp) status="rnc";
    else status="aprovado";
    const ins={id:"INS-"+String(inspections.length+1).padStart(3,"0"),obraId,tipoPeca,tag:tag.trim(),pav,data,resp,tipoInsp,obs,status,ok,nok,na,snapshot:{...states},etapa,nomeObra:obra?.nome||"",nomeCliente:cliente?.nome||"",rncId:null};
    if(status==="rnc"){setRncModal(ins);return;}
    await addInspecao(ins);
    setSaved2(true); setTimeout(()=>setSaved2(false),2000);
    limpar(); setTab("registros");
  };

  const confirmarRNC = async () => {
    if(!rncForm.desc||!rncForm.causa||!rncForm.resp){alert("Preencha: Descrição, Causa e Responsável.");return;}
    const num="RNC-"+String((inspections.filter(i=>i.rncId).length)+1).padStart(3,"0");
    const ins2={...rncModal,rncId:num};
    const rnc={id:num,data:rncModal.data,desc:rncForm.desc,causa:rncForm.causa,resp:rncForm.resp,acao:rncForm.acao,insp:ins2,status:"aberta"};
    await addRNC(rnc, ins2);
    setRncModal(null); setRncForm({desc:"",causa:"",resp:"",acao:""});
    limpar(); setTab("rnc");
  };

  const etapas=[{id:"forma",label:"🪵 Fôrma"},{id:"armadura",label:"🔩 Armadura"},{id:"concreto",label:"🏗 Concreto"},{id:"pos",label:"✅ Pós-Conc."}];
  const grid3={display:"grid",gridTemplateColumns:"1fr 1fr 1fr",gap:12,marginBottom:12};
  const grid4={display:"grid",gridTemplateColumns:"repeat(4,1fr)",gap:12,marginBottom:12};

  return (
    <div>
      <div style={{fontSize:20,fontWeight:800,color:GR,marginBottom:4}}>Nova <span style={{color:B}}>Inspeção</span></div>
      <div style={{fontSize:10,fontWeight:600,letterSpacing:1.5,textTransform:"uppercase",color:"#7a8099",marginBottom:18}}>Estrutura de Concreto Armado</div>

      <Card>
        <CardTitle>Identificação</CardTitle>
        <div style={grid3}>
          <Field label="Cliente">
            <Select value={clienteId} onChange={v=>{setClienteId(v);setObraId("");}}>
              <option value="">Selecione o cliente...</option>
              {clientes.map(c=><option key={c.id} value={c.id}>{c.nome}</option>)}
            </Select>
          </Field>
          <Field label="Obra">
            <Select value={obraId} onChange={setObraId}>
              <option value="">Selecione a obra...</option>
              {obrasFiltradas.map(o=><option key={o.id} value={o.id}>{o.nome}</option>)}
            </Select>
          </Field>
          <Field label="Data"><Input type="date" value={data} onChange={setData}/></Field>
        </div>
        <div style={grid4}>
          <Field label="Inspetor"><Input value={resp} onChange={setResp} placeholder="Nome do inspetor"/></Field>
          <Field label="Tipo de Inspeção">
            <Select value={tipoInsp} onChange={setTipoInsp}>
              <option value="1a">1ª Inspeção</option>
              <option value="reinsp">Reinspeção</option>
            </Select>
          </Field>
          <Field label="Tipo de Peça">
            <Select value={tipoPeca} onChange={setTipoPeca}>
              <option value="">Selecione...</option>
              {Object.keys(PECA_PREFIX).map(t=><option key={t}>{t}</option>)}
            </Select>
          </Field>
          <Field label="Pavimento / Local"><Input value={pav} onChange={setPav} placeholder="Térreo, 1º Pav."/></Field>
        </div>

        {tagsRapidas.length>0 && (
          <div style={{marginBottom:10}}>
            <div style={{fontSize:10,fontWeight:700,letterSpacing:1,textTransform:"uppercase",color:"#7a8099",marginBottom:6}}>Seleção Rápida</div>
            <div style={{display:"flex",flexWrap:"wrap",gap:5}}>
              {tagsRapidas.map(t=>(
                <button key={t} onClick={()=>setTag(t)}
                  style={{padding:"3px 12px",borderRadius:20,border:`1.5px solid ${tag===t?B:BBR}`,background:tag===t?B:BL,color:tag===t?"#fff":B,fontSize:11,fontWeight:700,cursor:"pointer",fontFamily:"inherit"}}>
                  {t}
                </button>
              ))}
            </div>
          </div>
        )}
        <Field label="TAG da Peça"><Input value={tag} onChange={setTag} placeholder="P01, V07, L03 — ou selecione acima"/></Field>
      </Card>

      <Card>
        <CardTitle>Etapa da Inspeção</CardTitle>
        <div style={{display:"flex",gap:8,marginBottom:16}}>
          {etapas.map(e=>(
            <button key={e.id} onClick={()=>setEtapa(e.id)}
              style={{flex:1,padding:"9px 6px",borderRadius:6,border:`2px solid ${etapa===e.id?ETAPA_COR[e.id]:"#dde1e9"}`,background:etapa===e.id?`${ETAPA_COR[e.id]}15`:"#f7f8fa",color:etapa===e.id?ETAPA_COR[e.id]:"#7a8099",fontWeight:700,fontSize:11,letterSpacing:.5,cursor:"pointer",fontFamily:"inherit",transition:"all .15s",textAlign:"center"}}>
              {e.label}
            </button>
          ))}
        </div>
        {CHECKLIST[etapa].map((item,i)=>{
          const id=etapa+"_"+i, st=states[id];
          const bg=st==="ok"?"#eaf7f1":st==="nok"?"#fdeaea":st==="na"?"rgba(0,0,0,.02)":"#f7f8fa";
          const bl=st==="ok"?`4px solid ${VD}`:st==="nok"?`4px solid ${VR}`:st==="na"?`4px solid #ccc`:"1.5px solid #dde1e9";
          return (
            <div key={id} style={{display:"flex",alignItems:"center",justifyContent:"space-between",padding:"9px 12px",background:bg,border:bl,borderRadius:5,marginBottom:5,transition:"all .15s"}}>
              <span style={{fontSize:12,flex:1,lineHeight:1.4,color:GR}}>{item}</span>
              <div style={{display:"flex",gap:5,marginLeft:10}}>
                {[["ok","✓ OK",VD],["nok","✗ NOK",VR],["na","N/A","#7a8099"]].map(([v,l,c])=>(
                  <button key={v} onClick={()=>setItem(id,st===v?undefined:v)}
                    style={{padding:"4px 10px",borderRadius:4,border:`1.5px solid ${st===v?c:c+"50"}`,background:st===v?c:c+"15",color:st===v?"#fff":c,fontSize:10,fontWeight:700,cursor:"pointer",fontFamily:"inherit",transition:"all .1s"}}>
                    {l}
                  </button>
                ))}
              </div>
            </div>
          );
        })}
      </Card>

      <Card>
        <CardTitle>Observações</CardTitle>
        <textarea value={obs} onChange={e=>setObs(e.target.value)} placeholder="Observações relevantes..."
          style={{width:"100%",minHeight:80,background:"#f7f8fa",border:"1.5px solid #dde1e9",borderRadius:5,padding:"9px 11px",fontSize:13,fontFamily:"inherit",outline:"none",resize:"vertical"}}/>
      </Card>

      {nok>0 && !isReinsp && (
        <div style={{display:"flex",alignItems:"center",gap:8,padding:"10px 14px",background:"#fef6e4",border:"1px solid #f0c070",borderLeft:`4px solid ${VM}`,borderRadius:5,marginBottom:12,fontSize:12,color:VM,fontWeight:500}}>
          ⚠ {nok} item(ns) NOK — peça será marcada para <strong>Reinspeção</strong>.
        </div>
      )}
      {nok>0 && isReinsp && (
        <div style={{display:"flex",alignItems:"center",gap:8,padding:"10px 14px",background:"#fdeaea",border:"1px solid #f0a0a0",borderLeft:`4px solid ${VR}`,borderRadius:5,marginBottom:12,fontSize:12,color:VR,fontWeight:500}}>
          🔴 Reinspeção com NOK — será aberta uma <strong>RNC</strong> automaticamente.
        </div>
      )}
      {saved2 && <div style={{padding:"10px 14px",background:"#eaf7f1",border:`1px solid ${VD}`,borderRadius:5,marginBottom:12,fontSize:12,color:VD,fontWeight:700}}>✓ Inspeção salva com sucesso!</div>}

      <div style={{display:"flex",gap:8,justifyContent:"flex-end"}}>
        <Btn variant="ghost" onClick={limpar}>Limpar</Btn>
        <Btn onClick={salvar}>Salvar Inspeção ▸</Btn>
      </div>

      {/* MODAL RNC */}
      <Modal open={!!rncModal} onClose={()=>setRncModal(null)} title="⚠ Abertura de RNC"
        footer={<><Btn variant="ghost" size="sm" onClick={()=>setRncModal(null)}>Cancelar</Btn><Btn variant="danger" size="sm" onClick={confirmarRNC}>Abrir RNC ▸</Btn></>}>
        {rncModal && (
          <div>
            <div style={{background:"#fdeaea",border:"1px solid rgba(214,48,49,.3)",borderRadius:6,padding:12,marginBottom:14}}>
              <div style={{fontSize:10,fontWeight:700,color:VR,letterSpacing:1,marginBottom:5}}>PEÇA REPROVADA NA REINSPEÇÃO</div>
              <div style={{fontWeight:700,fontSize:13}}>{rncModal.tipoPeca} · {rncModal.tag} · {rncModal.pav||"—"}</div>
              <div style={{fontSize:11,color:"#7a8099",marginTop:2}}>{rncModal.nomeCliente} — {rncModal.nomeObra}</div>
            </div>
            <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:10,marginBottom:10}}>
              <Field label="Número RNC"><Input value={"RNC-"+String(inspections.filter(i=>i.rncId).length+1).padStart(3,"0")} onChange={()=>{}} style={{background:"#f0f0f1"}}/></Field>
              <Field label="Data"><Input type="date" value={rncModal.data} onChange={()=>{}}/></Field>
            </div>
            <Field label="Descrição da Não Conformidade">
              <textarea value={rncForm.desc} onChange={e=>setRncForm({...rncForm,desc:e.target.value})} placeholder="Detalhe a não conformidade..."
                style={{width:"100%",minHeight:70,background:"#f7f8fa",border:"1.5px solid #dde1e9",borderRadius:5,padding:"8px 10px",fontSize:13,fontFamily:"inherit",outline:"none",resize:"vertical",marginBottom:10}}/>
            </Field>
            <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:10,marginTop:10}}>
              <Field label="Causa Provável">
                <Select value={rncForm.causa} onChange={v=>setRncForm({...rncForm,causa:v})}>
                  <option value="">Selecione...</option>
                  {["Falha de execução","Material fora de especificação","Projeto inadequado","Condições ambientais","Falha de comunicação","Outra"].map(c=><option key={c}>{c}</option>)}
                </Select>
              </Field>
              <Field label="Responsável pela Análise"><Input value={rncForm.resp} onChange={v=>setRncForm({...rncForm,resp:v})} placeholder="Nome"/></Field>
            </div>
            <div style={{marginTop:10}}>
              <Field label="Ação Corretiva Proposta">
                <textarea value={rncForm.acao} onChange={e=>setRncForm({...rncForm,acao:e.target.value})} placeholder="Ação corretiva..."
                  style={{width:"100%",minHeight:60,background:"#f7f8fa",border:"1.5px solid #dde1e9",borderRadius:5,padding:"8px 10px",fontSize:13,fontFamily:"inherit",outline:"none",resize:"vertical"}}/>
              </Field>
            </div>
          </div>
        )}
      </Modal>
    </div>
  );
}

// ── REGISTROS ─────────────────────────────────────────────────
function Registros({inspections, clientes, obras}) {
  const [filtroObra,setFiltroObra]=useState("");
  const [filtroStatus,setFiltroStatus]=useState("");
  const [filtroEtapa,setFiltroEtapa]=useState("");
  const [filtroTag,setFiltroTag]=useState("");
  const [detalhe,setDetalhe]=useState(null);

  const statusCor = {aprovado:VD, "reinspeção":VM, rnc:VR};
  const statusLabel = {aprovado:"Aprovado","reinspeção":"Reinspeção",rnc:"RNC"};

  const filtrado = useMemo(()=>inspections.filter(ins=>{
    if(filtroObra&&ins.obraId!==filtroObra) return false;
    if(filtroStatus&&ins.status!==filtroStatus) return false;
    if(filtroEtapa&&ins.etapa!==filtroEtapa) return false;
    if(filtroTag&&!ins.tag.toLowerCase().includes(filtroTag.toLowerCase())) return false;
    return true;
  }),[inspections,filtroObra,filtroStatus,filtroEtapa,filtroTag]);

  return (
    <div>
      <div style={{display:"flex",alignItems:"flex-end",justifyContent:"space-between",marginBottom:18}}>
        <div>
          <div style={{fontSize:20,fontWeight:800,color:GR}}>Registro de <span style={{color:B}}>Inspeções</span></div>
          <div style={{fontSize:10,fontWeight:600,letterSpacing:1.5,textTransform:"uppercase",color:"#7a8099",marginTop:3}}>Histórico completo · {filtrado.length} de {inspections.length} registros</div>
        </div>
      </div>

      {/* Filtros */}
      <div style={{display:"flex",gap:8,marginBottom:14,flexWrap:"wrap",alignItems:"center"}}>
        <span style={{fontSize:10,fontWeight:700,letterSpacing:1,textTransform:"uppercase",color:"#7a8099"}}>Filtrar:</span>
        <Select value={filtroObra} onChange={setFiltroObra} style={{width:"auto"}}>
          <option value="">Todas obras</option>
          {obras.map(o=><option key={o.id} value={o.id}>{o.nome}</option>)}
        </Select>
        <Select value={filtroStatus} onChange={setFiltroStatus} style={{width:"auto"}}>
          <option value="">Todos status</option>
          <option value="aprovado">Aprovado</option>
          <option value="reinspeção">Reinspeção</option>
          <option value="rnc">RNC</option>
        </Select>
        <Select value={filtroEtapa} onChange={setFiltroEtapa} style={{width:"auto"}}>
          <option value="">Todas etapas</option>
          {Object.entries(GL).map(([k,v])=><option key={k} value={k}>{v}</option>)}
        </Select>
        <Input value={filtroTag} onChange={setFiltroTag} placeholder="Buscar TAG..." style={{width:130}}/>
        <Btn variant="ghost" size="sm" onClick={()=>{setFiltroObra("");setFiltroStatus("");setFiltroEtapa("");setFiltroTag("");}}>✕ Limpar</Btn>
      </div>

      <div style={{borderRadius:8,border:"1px solid #dde1e9",overflow:"hidden",boxShadow:"0 1px 4px rgba(0,0,0,.04)"}}>
        <table style={{width:"100%",borderCollapse:"collapse"}}>
          <thead>
            <tr style={{background:B}}>
              {["#","Cliente","Obra","TAG","Tipo","Etapa","Pav.","Data","Resp.","Insp.","Status","Ver"].map(h=>(
                <th key={h} style={{padding:"10px 12px",textAlign:"left",fontSize:9,fontWeight:700,letterSpacing:1.5,textTransform:"uppercase",color:"rgba(255,255,255,.85)",whiteSpace:"nowrap"}}>{h}</th>
              ))}
            </tr>
          </thead>
          <tbody>
            {filtrado.length===0 ? (
              <tr><td colSpan={12} style={{textAlign:"center",padding:"44px",color:"#ccc",fontSize:12}}>📋 Nenhuma inspeção encontrada</td></tr>
            ) : filtrado.map((ins,i)=>(
              <tr key={ins.id} style={{background:i%2===0?"#fff":"#f9fafb"}}>
                <td style={{padding:"10px 12px",fontSize:11,color:"#7a8099"}}>{ins.id}</td>
                <td style={{padding:"10px 12px",fontSize:11,maxWidth:90,overflow:"hidden",textOverflow:"ellipsis",whiteSpace:"nowrap"}}>{ins.nomeCliente||"—"}</td>
                <td style={{padding:"10px 12px",fontSize:11,maxWidth:100,overflow:"hidden",textOverflow:"ellipsis",whiteSpace:"nowrap"}}>{ins.nomeObra||"—"}</td>
                <td style={{padding:"10px 12px",fontWeight:700,fontSize:12}}>{ins.tag}</td>
                <td style={{padding:"10px 12px",fontSize:11}}>{ins.tipoPeca}</td>
                <td style={{padding:"10px 12px"}}><Badge color="blue">{GL[ins.etapa]?.split(" ")[0]||ins.etapa}</Badge></td>
                <td style={{padding:"10px 12px",fontSize:11}}>{ins.pav||"—"}</td>
                <td style={{padding:"10px 12px",fontSize:11}}>{ins.data?.split("-").reverse().join("/")}</td>
                <td style={{padding:"10px 12px",fontSize:11}}>{ins.resp}</td>
                <td style={{padding:"10px 12px",fontSize:11,textAlign:"center"}}>{ins.tipoInsp==="1a"?"1ª":"2ª"}</td>
                <td style={{padding:"10px 12px"}}>
                  <span style={{display:"inline-flex",alignItems:"center",gap:5,fontSize:11,fontWeight:700,color:statusCor[ins.status]||"#7a8099"}}>
                    <span style={{width:7,height:7,borderRadius:"50%",background:statusCor[ins.status]||"#ccc",display:"inline-block"}}/>
                    {statusLabel[ins.status]||ins.status}
                  </span>
                </td>
                <td style={{padding:"10px 12px"}}><Btn variant="ghost" size="sm" onClick={()=>setDetalhe(ins)}>Ver</Btn></td>
              </tr>
            ))}
          </tbody>
        </table>
      </div>

      {/* Modal Detalhe */}
      <Modal open={!!detalhe} onClose={()=>setDetalhe(null)} title={detalhe?`${detalhe.id} · ${detalhe.tipoPeca} ${detalhe.tag}`:""} footer={<Btn variant="ghost" size="sm" onClick={()=>setDetalhe(null)}>Fechar</Btn>}>
        {detalhe && (
          <div>
            <div style={{fontSize:11,color:"#7a8099",marginBottom:12,lineHeight:1.6}}>
              <strong style={{color:GR}}>{detalhe.nomeCliente}</strong>{detalhe.nomeObra?" — "+detalhe.nomeObra:""} · {detalhe.pav||"—"} · {detalhe.data?.split("-").reverse().join("/")} · {detalhe.resp}
            </div>
            <div style={{display:"flex",gap:7,flexWrap:"wrap",marginBottom:14}}>
              <Badge color="green">✓ {detalhe.ok} OK</Badge>
              <Badge color="red">✗ {detalhe.nok} NOK</Badge>
              <Badge color="gray">N/A {detalhe.na}</Badge>
              <Badge color="blue">{GL[detalhe.etapa]}</Badge>
            </div>
            {CHECKLIST[detalhe.etapa]?.map((item,idx)=>{
              const st=detalhe.snapshot?.[detalhe.etapa+"_"+idx];
              const cor=st==="ok"?VD:st==="nok"?VR:"#ccc";
              return (
                <div key={idx} style={{display:"flex",alignItems:"center",gap:8,padding:"7px 10px",borderBottom:"1px solid #f0f2f5",fontSize:12}}>
                  <span style={{color:cor,fontWeight:800,width:14,textAlign:"center"}}>{st==="ok"?"✓":st==="nok"?"✗":"—"}</span>
                  <span style={{color:st==="nok"?GR:"#7a8099"}}>{item}</span>
                </div>
              );
            })}
            {detalhe.obs && <div style={{marginTop:12,padding:10,background:"#f7f8fa",borderRadius:5,fontSize:12,color:"#7a8099",lineHeight:1.6}}><strong style={{color:GR}}>Obs.:</strong> {detalhe.obs}</div>}

          </div>
        )}
      </Modal>
    </div>
  );
}

// ── RNCs ──────────────────────────────────────────────────────
function RNCs({rncs, encerrarRNC}) {
  const [filtroStatus,setFiltroStatus]=useState("");
  const filtrado = rncs.filter(r=>!filtroStatus||r.status===filtroStatus);

  return (
    <div>
      <div style={{display:"flex",alignItems:"flex-end",justifyContent:"space-between",marginBottom:18}}>
        <div>
          <div style={{fontSize:20,fontWeight:800,color:GR}}>Relatórios de <span style={{color:B}}>Não Conformidade</span></div>
          <div style={{fontSize:10,fontWeight:600,letterSpacing:1.5,textTransform:"uppercase",color:"#7a8099",marginTop:3}}>Abertas automaticamente após 2ª reprovação</div>
        </div>
      </div>

      <div style={{display:"flex",gap:8,marginBottom:16,alignItems:"center"}}>
        <span style={{fontSize:10,fontWeight:700,letterSpacing:1,textTransform:"uppercase",color:"#7a8099"}}>Filtrar:</span>
        <Select value={filtroStatus} onChange={setFiltroStatus} style={{width:"auto"}}>
          <option value="">Todos status</option>
          <option value="aberta">Aberta</option>
          <option value="encerrada">Encerrada</option>
        </Select>
        <span style={{fontSize:11,color:"#7a8099",marginLeft:"auto"}}>{filtrado.length} de {rncs.length} RNCs</span>
      </div>

      {filtrado.length===0 ? (
        <Card><div style={{textAlign:"center",padding:"40px 0",color:"#ccc"}}><div style={{fontSize:32,marginBottom:8,opacity:.3}}>✅</div><div style={{fontSize:12,fontWeight:600}}>Nenhuma RNC encontrada</div></div></Card>
      ) : filtrado.map(r=>(
        <div key={r.id} style={{background:"#fff",border:"1px solid #dde1e9",borderLeft:`4px solid ${r.status==="aberta"?VR:"#ccc"}`,borderRadius:8,padding:"16px 18px",marginBottom:12,position:"relative",boxShadow:"0 1px 4px rgba(0,0,0,.04)"}}>
          <div style={{fontSize:10,fontWeight:700,color:r.status==="aberta"?VR:"#7a8099",letterSpacing:2,textTransform:"uppercase",marginBottom:7}}>▸ {r.id}</div>
          <div style={{fontWeight:700,fontSize:14,color:GR,marginBottom:8}}>{r.insp?.tipoPeca} · {r.insp?.tag} — {r.insp?.nomeObra}</div>
          <div style={{display:"flex",gap:14,flexWrap:"wrap",marginBottom:8}}>
            {[["Cliente",r.insp?.nomeCliente],["Data",r.data?.split("-").reverse().join("/")],["Causa",r.causa],["Resp.",r.resp]].map(([l,v])=>(
              <div key={l} style={{fontSize:10,fontWeight:600,color:"#7a8099"}}>{l}: <span style={{color:GR}}>{v}</span></div>
            ))}
            <div style={{fontSize:10,fontWeight:700,letterSpacing:1,padding:"2px 8px",borderRadius:3,background:r.status==="aberta"?"#fdeaea":"#f0f0f1",color:r.status==="aberta"?VR:"#7a8099",border:`1px solid ${r.status==="aberta"?"rgba(214,48,49,.3)":"#dde1e9"}`}}>{r.status.toUpperCase()}</div>
          </div>
          <div style={{fontSize:12,color:"#7a8099",lineHeight:1.6,marginBottom:r.acao?6:0}}>{r.desc}</div>
          {r.acao && <div style={{fontSize:11,color:B,fontWeight:600}}>► Ação: {r.acao}</div>}
          <div style={{position:"absolute",top:16,right:16,display:"flex",gap:6}}>
            {r.status==="aberta" && <Btn variant="ghost" size="sm" onClick={()=>encerrarRNC(r.id)}>Encerrar</Btn>}
          </div>
        </div>
      ))}
    </div>
  );
}


// ── IO MODAL ───────────────────────────────────────────────────
function IOModal({ open, onClose, clientes, obras, inspections, rncs, onImport }) {
  const [importing, setImporting] = useState(false);
  const [preview, setPreview] = useState(null);
  const [dragOver, setDragOver] = useState(false);
  if (!open) return null;

  const exportar = () => {
    const data = { versao:'1.0', exportadoEm:new Date().toISOString(), empresa:'Debatin Engenharia', clientes, obras, inspections, rncs };
    const blob = new Blob([JSON.stringify(data,null,2)], {type:'application/json'});
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href=url; a.download=`debatin-dados-${new Date().toLocaleDateString('pt-BR').replace(/\//g,'-')}.json`;
    a.click(); URL.revokeObjectURL(url);
    window.showToast('Dados exportados!','ok'); onClose();
  };

  const lerArquivo = (file) => {
    if(!file||!file.name.endsWith('.json')){window.showToast('Selecione um arquivo .json','err');return;}
    setImporting(true);
    const r=new FileReader();
    r.onload=(e)=>{try{setPreview(JSON.parse(e.target.result));}catch{window.showToast('JSON inválido','err');}setImporting(false);};
    r.readAsText(file);
  };

  const confirmar = async () => {
    if(!preview) return;
    await onImport(preview);
    window.showToast(`Importado: ${preview.inspections?.length||0} inspeções`,'ok');
    setPreview(null); onClose();
  };

  return (
    <div className="io-overlay" onClick={e=>{if(e.target===e.currentTarget)onClose();}}>
      <div className="io-box">
        <div className="io-title">📂 Exportar / Importar Dados</div>

        <div className="io-label">Exportar para o Drive</div>
        <div className="io-desc">Gera um arquivo <strong>.json</strong> com todos os dados. Salve na sua pasta do Drive.</div>
        <div className="io-stats">
          {[['Clientes',clientes.length],['Obras',obras.length],['Inspeções',inspections.length],['RNCs',rncs.length]].map(([l,v])=>(
            <div key={l} className="io-stat"><div className="io-stat-val">{v}</div><div className="io-stat-lbl">{l}</div></div>
          ))}
        </div>
        <div style={{marginTop:12}}>
          <button className="io-btn io-btn-primary" onClick={exportar}>⬇ Exportar dados.json</button>
        </div>

        <div className="io-divider"/>

        <div className="io-label">Importar do Drive</div>
        <div className="io-desc">Selecione um <strong>.json</strong> exportado anteriormente. <strong style={{color:'#d63031'}}>Dados atuais serão substituídos.</strong></div>

        {!preview ? (
          <div className={`drop-zone${dragOver?' over':''}`}
            onDragOver={e=>{e.preventDefault();setDragOver(true);}}
            onDragLeave={()=>setDragOver(false)}
            onDrop={e=>{e.preventDefault();setDragOver(false);lerArquivo(e.dataTransfer.files[0]);}}>
            <input type="file" accept=".json" onChange={e=>lerArquivo(e.target.files[0])}/>
            <div className="drop-zone-icon">📄</div>
            <div className="drop-zone-text">{importing?'Lendo...':<><span>Clique para selecionar</span> ou arraste o .json</>}</div>
          </div>
        ) : (
          <div style={{background:'#f0f4ff',border:'1.5px solid rgba(29,71,141,.25)',borderRadius:8,padding:14}}>
            <div style={{fontSize:11,fontWeight:700,color:'#1D478D',marginBottom:10}}>✓ Arquivo lido — confirme para importar:</div>
            <div className="io-stats">
              {[['Clientes',preview.clientes?.length||0],['Obras',preview.obras?.length||0],['Inspeções',preview.inspections?.length||0],['RNCs',preview.rncs?.length||0]].map(([l,v])=>(
                <div key={l} className="io-stat"><div className="io-stat-val">{v}</div><div className="io-stat-lbl">{l}</div></div>
              ))}
            </div>
            {preview.exportadoEm&&<div style={{fontSize:10,color:'#7a8099',marginTop:8}}>Exportado em: {new Date(preview.exportadoEm).toLocaleString('pt-BR')}</div>}
            <div style={{display:'flex',gap:8,marginTop:12}}>
              <button className="io-btn io-btn-ghost" onClick={()=>setPreview(null)} style={{fontSize:10,padding:'6px 12px'}}>✕ Cancelar</button>
              <button className="io-btn io-btn-primary" onClick={confirmar} style={{fontSize:10,padding:'6px 14px'}}>✓ Confirmar importação</button>
            </div>
          </div>
        )}
        <div className="io-footer">
          <button className="io-btn io-btn-ghost" onClick={onClose} style={{fontSize:10,padding:'6px 14px'}}>Fechar</button>
        </div>
      </div>
    </div>
  );
}

// ── ROOT ───────────────────────────────────────────────────────
function Root() {
  const [showIO, setShowIO] = useState(false);
  const [extData, setExtData] = useState(null);

  const handleImport = async (data) => {
    const c=data.clientes||[], o=data.obras||[], i=data.inspections||[], r=data.rncs||[];
    await Promise.all([salvar('dbt:clientes',c),salvar('dbt:obras',o),salvar('dbt:inspections',i),salvar('dbt:rncs',r)]);
    setExtData({clientes:c,obras:o,inspections:i,rncs:r,_ts:Date.now()});
  };

  return <AppContainer showIO={showIO} setShowIO={setShowIO} extData={extData} onImport={handleImport}/>;
}

      </div>

      {/* TABS — scrollable no mobile */}
      <div className="tabs-scroll" style={{background:'#fff',borderBottom:'1px solid #dde1e9',display:'flex',overflowX:'auto',WebkitOverflowScrolling:'touch',scrollbarWidth:'none'}}>
        {tabs.map(t=>(
          <button key={t.id} onClick={()=>setTab(t.id)} className="tab-btn"
            style={{padding:'13px 14px',background:'none',border:'none',borderBottom:`3px solid ${tab===t.id?'#1D478D':'transparent'}`,color:tab===t.id?'#1D478D':'#7a8099',fontWeight:700,fontSize:11,letterSpacing:.5,textTransform:'uppercase',cursor:'pointer',whiteSpace:'nowrap',fontFamily:'inherit',flexShrink:0}}>
            {t.label}
          </button>
        ))}
      </div>

      {/* CONTENT */}
      <div className="main-pad" style={{maxWidth:1140,margin:'0 auto',padding:'20px 16px',paddingBottom:80}}>
        {tab==='dashboard' && <Dashboard  inspections={insp} rncs={rncs} obras={obras} clientes={clientes}/>}
        {tab==='cadastros' && <Cadastros  clientes={clientes} setClientes={setClientes} obras={obras} setObras={setObras} persistAll={persistAll} inspections={insp} rncs={rncs}/>}
        {tab==='inspecao'  && <NovaInspecao clientes={clientes} obras={obras} addInspecao={addInspecao} addRNC={addRNC} inspections={insp} setTab={setTab}/>}
        {tab==='registros' && <Registros  inspections={insp} clientes={clientes} obras={obras}/>}
        {tab==='rnc'       && <RNCs       rncs={rncs} encerrarRNC={encerrarRNC}/>}
      </div>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<Root/>);
</script>
</body>
</html>
